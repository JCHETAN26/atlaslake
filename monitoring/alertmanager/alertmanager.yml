# AtlasLake Alertmanager (Phase 30).
# Every alert goes to the local webhook receiver (`python -m monitoring.exporter --webhook-port 9111`),
# which appends it to data/alerts.jsonl — the chaos test reads that file to prove alerts fired.
# For real paging add a slack/pagerduty receiver to the `critical` route.
global:
  resolve_timeout: 5m

route:
  receiver: atlas-webhook
  group_by: [alertname, severity]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="critical"']
      receiver: atlas-webhook
      group_wait: 5s
      repeat_interval: 1h
    - matchers: ['severity="warning"']
      receiver: atlas-webhook

receivers:
  - name: atlas-webhook
    webhook_configs:
      - url: http://host.docker.internal:9111/alerts
        send_resolved: true

inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: [alertname]
