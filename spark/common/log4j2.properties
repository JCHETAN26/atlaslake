# Spark driver logging for AtlasLake: Spark defaults at WARN, minus two known-noisy loggers.
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console
appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex

# Catalog caching is deliberately disabled (other processes commit concurrently), so Iceberg creates a
# FileIO per table load and warns with a full stack trace when it is garbage-collected unclosed.
logger.s3fileio.name = org.apache.iceberg.aws.s3.S3FileIO
logger.s3fileio.level = error
# Harmless in local mode (KAFKA-1894 note for interrupted consumers).
logger.kafkaconsumer.name = org.apache.spark.sql.kafka010.consumer.KafkaDataConsumer
logger.kafkaconsumer.level = error
