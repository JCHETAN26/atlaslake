name: atlaslake
version: "1.0.0"
config-version: 2
profile: atlaslake

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # overlap window re-read on every incremental run (guards against clock skew between writers)
  incremental_lookback_minutes: 1
  low_stock_threshold: 25

models:
  atlaslake:
    +on_schema_change: append_new_columns
    staging:
      +materialized: view
      +schema: stg
    intermediate:
      +materialized: view
      +schema: int
    marts:
      +schema: gold
      +materialized: table
