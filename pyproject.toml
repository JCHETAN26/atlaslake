[project]
name = "atlaslake"
version = "0.1.0"
description = "Production-grade streaming + batch lakehouse for commerce data"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "pyspark==3.5.9",
    "pyiceberg[pyarrow,sql-postgres]>=0.10,<0.13",
    "duckdb>=1.3,<2",
    "dbt-core>=1.10,<1.13",
    "dbt-duckdb>=1.9,<1.12",
    "confluent-kafka>=2.6,<3",
    "fastavro>=1.9,<2",
    "httpx>=0.27,<1",
    "psycopg[binary]>=3.2,<4",
    "numpy>=1.26,<3",
    "pandas>=2.2,<2.3",
    "pyarrow>=17,<20",
    "typer>=0.12,<1",
    "rich>=13",
    "pyyaml>=6",
    "prometheus-client>=0.20",
    "openlineage-python>=1.20,<2",
    "setuptools<81",
    "great-expectations>=1.3,<2",
]

[project.optional-dependencies]
snowflake = ["snowflake-connector-python[pandas]>=3.12"]
reference = [
    "openpyxl>=3.1.5",
]

[project.scripts]
atlas = "cli.main:app"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-timeout>=2.3",
    "pre-commit>=3.8",
    "types-PyYAML",
    "pandas-stubs<2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "core", "simulator", "contracts", "producers", "ingestion", "spark",
    "baseline", "quality", "reconciliation", "lineage", "monitoring",
    "cli", "benchmarks", "lakehouse",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["dbt/target", "dbt/dbt_packages", "infrastructure"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF012", "B008", "RUF001", "RUF002", "RUF003", "SIM105", "SIM115", "RUF005", "RUF007"]

[tool.ruff.lint.per-file-ignores]
"quality/runner.py" = ["E402"]  # GX logging must be silenced before import

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["dbt/", "airflow/", "infrastructure/", "tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "spark: needs a local Spark session (JVM)",
    "integration: needs the docker-compose stack",
    "failure: failure-injection experiments (slow)",
]
timeout = 900
addopts = "-ra"
